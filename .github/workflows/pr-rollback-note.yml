name: Rollback note

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  rollback-note:
    name: PR has a Rollback section
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-rollback-note.sh
