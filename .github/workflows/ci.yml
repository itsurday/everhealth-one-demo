name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks + Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Rollback-note check self-test
        run: bash scripts/check-rollback-note.test.sh
      - name: Doc generator + /impact self-test
        run: python3 scripts/test_docs.py
      - name: Living docs are current (fails if metadata changed without regenerating)
        run: python3 scripts/gen_docs.py --check
      - name: Code Analyzer (fails on severity 1-2)
        run: sf code-analyzer run --workspace force-app --severity-threshold 2 --output-file code-analyzer.html
      - name: Upload Code Analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer
          path: code-analyzer.html

  validate:
    name: Validate deploy + Apex tests (throwaway scratch org)
    needs: static
    runs-on: ubuntu-latest
    env:
      DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
    steps:
      - name: Skip notice (no Dev Hub secret)
        if: env.DEVHUB_AUTH_URL == ''
        run: echo "::warning::DEVHUB_SFDX_AUTH_URL secret not set - deploy validation skipped."
      - uses: actions/checkout@v4
        if: env.DEVHUB_AUTH_URL != ''
      - uses: actions/setup-node@v4
        if: env.DEVHUB_AUTH_URL != ''
        with:
          node-version: 22
      - name: Install Salesforce CLI
        if: env.DEVHUB_AUTH_URL != ''
        run: npm install --global @salesforce/cli
      - name: Authenticate Dev Hub
        if: env.DEVHUB_AUTH_URL != ''
        run: |
          printf '%s' "$DEVHUB_AUTH_URL" > "$RUNNER_TEMP/devhub.url"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/devhub.url" --alias devhub --set-default-dev-hub
          rm -f "$RUNNER_TEMP/devhub.url"
      - name: Create scratch org (1 day)
        if: env.DEVHUB_AUTH_URL != ''
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ci --target-dev-hub devhub --duration-days 1 --wait 20
      - name: Validate deploy with local tests
        if: env.DEVHUB_AUTH_URL != ''
        run: sf project deploy validate --target-org ci --test-level RunLocalTests --wait 30
      - name: Delete scratch org
        if: always() && env.DEVHUB_AUTH_URL != ''
        run: sf org delete scratch --target-org ci --no-prompt || true
